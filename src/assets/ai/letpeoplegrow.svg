<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <style>
      .name { fill: #2F5647; font-weight: 700; }
      .meta { fill: #8A9691; }
      .h1 { fill: #2E3A45; font-weight: 700; }
      .sub { fill: #5C6B6F; }
      .sublead { fill: #2E3A45; font-weight: 700; }
      .label { fill: #2E3A45; font-weight: 700; letter-spacing: .04em; }
      .body { fill: #6B777B; }
      .pill { fill: #2F5647; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 600; }
      .banner { fill: #34433D; }
      .bannerlead { fill: #2E3A45; font-weight: 700; }
      .foot { fill: #8A9691; }
    </style>
  </defs>

  <rect width="1200" height="675" fill="#F4F7F5"/>
  <rect width="1200" height="10" fill="#2F5647"/>

  <text x="72" y="92" class="name" font-size="34">LetPeopleGrow</text>
  <text x="72" y="118" class="meta" font-size="15">a LetPeopleWork plugin · Claude-Code-native</text>

  <text x="72" y="182" class="h1" font-size="40">Prepare for, capture and learn from 1:1s.</text>
  <text x="72" y="216" font-size="18"><tspan class="sub">A plugin for people development. </tspan><tspan class="sublead">Coaching support, never a performance dossier.</tspan></text>

  <line x1="72" y1="244" x2="1128" y2="244" stroke="#E0E6E2" stroke-width="1"/>

  <!-- cards -->
  <g>
    <rect x="72" y="280" width="249" height="210" rx="16" fill="#FFFFFF" stroke="#E3E8E5"/>
    <circle cx="104" cy="324" r="14" fill="none" stroke="#2F5647" stroke-width="2.5"/><circle cx="104" cy="324" r="5" fill="#2F5647"/>
    <text x="130" y="330" class="label" font-size="16">PREP</text>
    <rect x="96" y="350" width="80" height="28" rx="8" fill="#E8F0EB"/>
    <text x="110" y="369" class="pill" font-size="13">prep</text>
    <text x="96" y="414" class="body" font-size="14">Before a 1:1: a one-page</text>
    <text x="96" y="435" class="body" font-size="14">prep from the whole</text>
    <text x="96" y="456" class="body" font-size="14">history (both sides).</text>
  </g>
  <g>
    <rect x="341" y="280" width="249" height="210" rx="16" fill="#FFFFFF" stroke="#E3E8E5"/>
    <circle cx="373" cy="324" r="14" fill="none" stroke="#2F5647" stroke-width="2.5"/><circle cx="373" cy="324" r="5" fill="#2F5647"/>
    <text x="399" y="330" class="label" font-size="16">CAPTURE</text>
    <rect x="365" y="350" width="92" height="28" rx="8" fill="#E8F0EB"/>
    <text x="379" y="369" class="pill" font-size="13">capture</text>
    <text x="365" y="414" class="body" font-size="14">After: turn your</text>
    <text x="365" y="435" class="body" font-size="14">brain-dump into a</text>
    <text x="365" y="456" class="body" font-size="14">clean session note.</text>
  </g>
  <g>
    <rect x="610" y="280" width="249" height="210" rx="16" fill="#FFFFFF" stroke="#E3E8E5"/>
    <circle cx="642" cy="324" r="14" fill="none" stroke="#2F5647" stroke-width="2.5"/><circle cx="642" cy="324" r="5" fill="#2F5647"/>
    <text x="668" y="330" class="label" font-size="16">GROWTH</text>
    <rect x="634" y="350" width="84" height="28" rx="8" fill="#E8F0EB"/>
    <text x="648" y="369" class="pill" font-size="13">growth</text>
    <text x="634" y="414" class="body" font-size="14">An evidence-first</text>
    <text x="634" y="435" class="body" font-size="14">development plan,</text>
    <text x="634" y="456" class="body" font-size="14">co-owned with them.</text>
  </g>
  <g>
    <rect x="879" y="280" width="249" height="210" rx="16" fill="#FFFFFF" stroke="#E3E8E5"/>
    <circle cx="911" cy="324" r="14" fill="none" stroke="#2F5647" stroke-width="2.5"/><circle cx="911" cy="324" r="5" fill="#2F5647"/>
    <text x="937" y="330" class="label" font-size="16">PATTERNS</text>
    <rect x="903" y="350" width="92" height="28" rx="8" fill="#E8F0EB"/>
    <text x="917" y="369" class="pill" font-size="13">patterns</text>
    <text x="903" y="414" class="body" font-size="14">The longitudinal read:</text>
    <text x="903" y="435" class="body" font-size="14">one person or your</text>
    <text x="903" y="456" class="body" font-size="14">whole roster.</text>
  </g>

  <!-- banner -->
  <rect x="72" y="524" width="1056" height="74" rx="14" fill="#E8F0EB"/>
  <text x="104" y="568" font-size="16"><tspan class="bannerlead">Relationship-shaped:</tspan><tspan class="banner" dx="6">a person over time, not an event. Notes stay local. Practices: GROW, SBI, NVC, career conversations.</tspan></text>

  <text x="72" y="650" class="foot" font-size="14">A LetPeopleWork plugin for Claude Code · github.com/LetPeopleWork/LetPeopleGrow</text>
</svg>
