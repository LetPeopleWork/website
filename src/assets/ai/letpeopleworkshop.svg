<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <style>
      .name { fill: #2F5647; font-weight: 700; }
      .meta { fill: #8A9691; }
      .h1 { fill: #2E3A45; font-weight: 700; }
      .accent { fill: #2F5647; font-weight: 700; }
      .sub { fill: #5C6B6F; }
      .label { fill: #2E3A45; font-weight: 700; letter-spacing: .04em; }
      .body { fill: #6B777B; }
      .pill { fill: #2F5647; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 600; }
      .banner { fill: #34433D; }
      .bannerlead { fill: #2E3A45; font-weight: 700; }
      .foot { fill: #8A9691; }
    </style>
  </defs>

  <rect width="1200" height="675" fill="#F4F7F5"/>
  <rect width="1200" height="10" fill="#2F5647"/>

  <text x="72" y="92" class="name" font-size="34">LetPeopleWorkShop</text>
  <text x="72" y="118" class="meta" font-size="15">a LetPeopleWork plugin · Claude-Code-native</text>

  <text x="72" y="182" class="h1" font-size="40">Let people work<tspan class="accent">(shop)</tspan>.</text>
  <text x="72" y="216" class="sub" font-size="18">Design, prepare and learn from workshops. All in markdown.</text>

  <line x1="72" y1="244" x2="1128" y2="244" stroke="#E0E6E2" stroke-width="1"/>

  <!-- connectors -->
  <line x1="408" y1="375" x2="432" y2="375" stroke="#2F5647" stroke-width="2"/>
  <line x1="768" y1="375" x2="792" y2="375" stroke="#2F5647" stroke-width="2"/>

  <!-- cards -->
  <g>
    <rect x="72" y="280" width="336" height="190" rx="16" fill="#FFFFFF" stroke="#E3E8E5"/>
    <circle cx="106" cy="326" r="15" fill="none" stroke="#2F5647" stroke-width="2.5"/><circle cx="106" cy="326" r="5.5" fill="#2F5647"/>
    <text x="134" y="332" class="label" font-size="17">DESIGN</text>
    <rect x="100" y="352" width="104" height="30" rx="8" fill="#E8F0EB"/>
    <text x="114" y="372" class="pill" font-size="14">designer</text>
    <text x="100" y="418" class="body" font-size="15">Describe the session; get a</text>
    <text x="100" y="440" class="body" font-size="15">grounded, time-reconciled agenda.</text>
  </g>
  <g>
    <rect x="432" y="280" width="336" height="190" rx="16" fill="#FFFFFF" stroke="#E3E8E5"/>
    <circle cx="466" cy="326" r="15" fill="none" stroke="#2F5647" stroke-width="2.5"/><circle cx="466" cy="326" r="5.5" fill="#2F5647"/>
    <text x="494" y="332" class="label" font-size="17">PREP</text>
    <rect x="460" y="352" width="104" height="30" rx="8" fill="#E8F0EB"/>
    <text x="474" y="372" class="pill" font-size="14">executor</text>
    <text x="460" y="418" class="body" font-size="15">Turn the design into a prep</text>
    <text x="460" y="440" class="body" font-size="15">pack: room, Miro or video call.</text>
  </g>
  <g>
    <rect x="792" y="280" width="336" height="190" rx="16" fill="#FFFFFF" stroke="#E3E8E5"/>
    <circle cx="826" cy="326" r="15" fill="none" stroke="#2F5647" stroke-width="2.5"/><circle cx="826" cy="326" r="5.5" fill="#2F5647"/>
    <text x="854" y="332" class="label" font-size="17">LEARN</text>
    <rect x="820" y="352" width="104" height="30" rx="8" fill="#E8F0EB"/>
    <text x="834" y="372" class="pill" font-size="14">feedback</text>
    <text x="820" y="418" class="body" font-size="15">Debrief after, and capture</text>
    <text x="820" y="440" class="body" font-size="15">reusable lessons for next time.</text>
  </g>

  <!-- banner -->
  <rect x="72" y="506" width="1056" height="74" rx="14" fill="#E8F0EB"/>
  <text x="104" y="550" font-size="16"><tspan class="bannerlead">Practices library:</tspan><tspan class="banner" dx="6">Liberating Structures, Training from the BACK of the Room. Extensible by dropping in a markdown file.</tspan></text>

  <text x="72" y="636" class="foot" font-size="14">A LetPeopleWork plugin for Claude Code · github.com/LetPeopleWork/LetPeopleWorkShop</text>
</svg>
