<!doctype html>
<!-- Legacy URL from the pre-2026 site. The blog now lives on Substack.
     GitHub Pages cannot send a real 301, so this is the static equivalent:
     canonical + immediate meta refresh, which Google treats as a permanent
     redirect. Found as a 404 in the Wayback Machine's list of the site's URLs
     (October 2026). -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>LetPeopleWork blog | LetPeopleWork</title>
    <link rel="canonical" href="https://blog.letpeople.work/" />
    <meta name="robots" content="noindex" />
    <meta http-equiv="refresh" content="0; url=https://blog.letpeople.work/" />
  </head>
  <body>
    <p>The blog now lives on Substack. <a href="https://blog.letpeople.work/">LetPeopleWork blog</a></p>
  </body>
</html>
