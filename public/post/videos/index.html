<!doctype html>
<!-- Legacy URL from the pre-2026 site. The videos are on the LetPeopleWork YouTube channel.
     GitHub Pages cannot send a real 301, so this is the static equivalent:
     canonical + immediate meta refresh, which Google treats as a permanent
     redirect. Found as a 404 in the Wayback Machine's list of the site's URLs
     (October 2026). -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>LetPeopleWork videos | LetPeopleWork</title>
    <link rel="canonical" href="https://www.youtube.com/@LetPeopleWork/videos" />
    <meta name="robots" content="noindex" />
    <meta http-equiv="refresh" content="0; url=https://www.youtube.com/@LetPeopleWork/videos" />
  </head>
  <body>
    <p>The videos are on the LetPeopleWork YouTube channel. <a href="https://www.youtube.com/@LetPeopleWork/videos">LetPeopleWork videos</a></p>
  </body>
</html>
