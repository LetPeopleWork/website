# Validated Jobs-to-be-Done — letpeople.work
#
# SSOT bootstrapped by DISCUSS (2026-08-03, feature: sizing-poker).
# Greenfield: no docs/product/ existed before this file.
#
# Evidence status legend:
#   validated  — confirmed against real user contact (interviews, support, analytics)
#   asserted   — grounded in practitioner conversation, not yet tested with users
#
# NOTE: the first three jobs remain `asserted`. The Slack thread (Benji, Oliver,
# Liz Rettig, Chris G) is practitioner input from inside and adjacent to the
# company, NOT customer discovery. Do not treat these as validated until a real
# team runs a real round. This distinction is the whole point of the opportunity
# scores staying provisional.
#
# `size-together-apart` (added 2026-08-05) is the first job with evidence from
# outside the company: two of the first two external reviewers of the live page
# raised it unprompted and independently.

jobs:
  - id: size-without-estimating
    status: asserted
    story: >
      When I am about to pull the next item into a system that is not starving,
      I want to know whether it fits the time my system actually takes,
      so I can start it or slice it without holding an estimation meeting.
    dimensions:
      functional: Decide start-vs-slice for each candidate item, fast.
      emotional: Relief at not having to defend a number nobody believes.
      social: Be seen as the team that stopped theatre without becoming reckless.
    forces:
      push: >
        Estimation rounds cost hours and produce numbers the team does not trust
        and does not use. The output is a story point, which answers no question
        anyone actually has.
      pull: >
        A single yes/no per item, anchored to a number the team already earned
        from its own delivery history.
      anxiety: >
        "If we stop estimating, we lose the conversation." The three-way question
        must keep the two conversations worth having (this is too big; this is
        blocked on something) and drop the rest.
      habit: >
        Planning poker is muscle memory, ceremonially protected, and already
        on the calendar. Replacing it means displacing a recurring meeting.
    opportunity:
      importance: high
      satisfaction: low
      note: >
        Provisional. Importance inferred from two existing paid workshops
        ("SLE & Right Sizing", "Epic Right Sizing & Slicing") selling against
        this problem; satisfaction inferred from the absence of any tool that
        anchors sizing to a team's own SLE. Revisit after slice 1.

  - id: find-the-coupling
    status: asserted
    story: >
      When my team keeps missing its expectations without any single item
      looking large, I want to see which items are waiting on a person, a
      decision, or another team, so I can fix the dependency instead of
      re-estimating the work.
    dimensions:
      functional: Surface out-of-team dependencies before work starts, not after it stalls.
      emotional: Vindication that the delays were structural, not effort mis-estimated.
      social: Bring the steering conversation a system finding, not an apology.
    forces:
      push: >
        Items age past the SLE for reasons that have nothing to do with size,
        and estimation formats have no slot to record that.
      pull: >
        A middle answer — "yes, if…" — that names the condition in one tap.
      anxiety: >
        Naming a dependency can read as blaming a colleague or another team.
        The chip vocabulary must stay structural, never personal.
      habit: >
        Dependencies currently surface in standup after the item is already
        stuck, where the cost is sunk.
    opportunity:
      importance: high
      satisfaction: very-low
      note: >
        Provisional, and the highest-uncertainty job of the three. This is the
        one thing no competing tool does at all. If slice 1 shows the middle
        bucket going unused, this job is disproven and the feature collapses to
        a timer over Lunar Logic's existing card deck.

  # Revised 2026-08-04: the audience is a PO or Scrum Master who has never met the
  # terminology, not a practitioner who already has flow data. Developers are
  # explicitly out of scope as an entry point - they participate in a round that
  # someone else facilitates, they do not go looking for one.
  - id: know-my-sle
    status: asserted
    story: >
      When I am asked what my team's SLE is and I do not know,
      I want to find out what it is and where it comes from,
      so I can use it instead of guessing.
    dimensions:
      functional: Obtain a defensible 85th-percentile cycle time.
      emotional: Stop feeling like the team improvising without instruments.
      social: Answer the "how long will this take" question with evidence.
    forces:
      push: The tool asks for a number the visitor may not have.
      pull: Lighthouse computes it from the tracker they already use.
      anxiety: "Our data is too messy for this to mean anything."
      habit: Reaching for a team average or a gut number instead of a percentile.
    opportunity:
      importance: medium
      satisfaction: low
      note: >
        Reweighted 2026-08-04: with the page confirmed as a teaser rather than a
        product (D12), this job carries the whole second half of the value. The
        page must be useful on its own AND leave an appetite Lighthouse can
        satisfy. It is answered in the wrap-up, never in the setup: the config
        step asks for a number of days in plain language and accepts a guess,
        because asking an unfamiliar visitor for an SLE up front is what made the
        first version go unread.

  # Added 2026-08-05 from the first external feedback on the live page.
  # Deliberately NOT a website job: see feature-delta.md D13, D14, D16. It is
  # recorded here because producing this evidence is the website page's stated
  # second job, and this is the signal the Lighthouse decision needs.
  - id: size-together-apart
    status: asserted-with-external-evidence
    story: >
      When my team is distributed and we are sizing on a video call,
      I want everyone to answer independently rather than out loud,
      so the first person to speak does not decide it for everyone else.
    dimensions:
      functional: Collect one independent answer per person, then surface only the disagreements.
      emotional: Confidence that the result is the team's read, not the loudest person's.
      social: Quieter team members are counted without having to interrupt.
    forces:
      push: >
        On a shared screen the first voice anchors the room. In a co-located
        session a simultaneous show of hands fixes that; on a video call it does
        not, because people talk over each other. The current page mitigates
        anchoring with facilitation only, which is weakest exactly where a web
        tool is most likely to be used.
      pull: >
        Everyone votes on their own device, privately, and the tool shows where
        the team actually disagrees.
      anxiety: >
        Another room-based voting tool is a commodity: at least six are free and
        several sync with the tracker. Entering that category with no backend and
        no integration wins nothing.
      habit: >
        Planning poker tools have trained people to expect a join link. That
        expectation is why both reviewers were surprised, and it is the reason
        the page now states who drives it in its opening sentence.
    evidence:
      - source: "Oliver, Slack, 2026-08-05"
        quote: "I was kind of expecting some kind of sizing 'session' that people join, rather than a questionnaire."
        note: >
          Same reviewer also judged the current scope adequate: "I guess this
          gives most of the value for a v1."
      - source: "Mya, Slack, 2026-08-05"
        quote: "most powerful in a virtual session when people are not co-located"
    opportunity:
      importance: high
      satisfaction: very-low
      note: >
        The value depends on the loop closing: items drawn from the backlog,
        results written back, and the refinement meeting reduced to the Maybes
        and Nos. That is only true inside Lighthouse. Built on the website it is
        the weak version of the strong feature, and it spends the differentiator
        that is supposed to pull people towards the product.
