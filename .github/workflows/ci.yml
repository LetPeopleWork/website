name: CI

# The check Renovate waits for before it merges a dependency update
# (renovate.json): lint with zero warnings, a type check, tests, and a
# production build that prints no warnings. Runs on every pull request and
# on main.
on:
  pull_request:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      # Vite and vitest do not check types, and plain "tsc --noEmit" checks
      # nothing here (the root tsconfig.json has "files": []). This step is the
      # only one that fails when a dependency update breaks the types.
      - name: Type check
        run: bun run typecheck

      - name: Test
        run: bun run test

      # Vite has no "warnings are errors" switch, so the log is checked: a
      # warning (Tailwind's "warn -", Rollup's "(!)") fails the check.
      - name: Build (no warnings)
        shell: bash
        run: |
          bun run build 2>&1 | tee build.log
          if grep -inE 'warn|\(!\)' build.log; then
            echo "::error::The build printed warnings (listed above). CI treats them as errors."
            exit 1
          fi
