name: CI

# The check Renovate waits for before it merges a dependency update
# (renovate.json). Lint is not part of it yet: the codebase has open
# react-hooks/set-state-in-effect errors; add `bun run lint` once they are fixed.
on:
  pull_request:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build
