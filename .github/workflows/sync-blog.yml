name: Sync Blog from Substack

on:
  schedule:
    # Run once a day at 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch: # Allow manual trigger
  push:
    branches:
      - main
    paths:
      - '.github/workflows/sync-blog.yml'
      - 'scripts/sync-blog.mjs'

jobs:
  sync-blog:
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.22.1'

      # Zero-dependency script (native fetch), no npm install needed.
      - name: Fetch latest blog posts
        run: node scripts/sync-blog.mjs

      - name: Commit and push if changed
        run: |
            git config --global user.name 'github-actions[bot]'
            git config --global user.email 'github-actions[bot]@users.noreply.github.com'
            git add public/blog-data.json
            if ! git diff --cached --quiet; then
            git commit -m "Update blog data"
            git push
            else
            echo "No changes to commit"
            fi
