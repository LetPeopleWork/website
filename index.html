      <p>LetPeopleWork GmbH is a Swiss company that builds tools for delivery teams. Lighthouse is a self-hosted, source-available flow metrics and Monte Carlo forecasting tool. It connects to Jira Cloud and Data Center, Azure DevOps, Linear and ServiceNow, and runs inside your own network. Sizing Poker is a free browser tool that sizes a backlog by asking one question per item instead of estimating it.</p>
